<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotes — Frosted Pane Press</title>
<meta name="description" content="Every quote that rotates on the Frosted Pane Press resources page. All public domain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;700&family=Karla:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /*
    Division resources page — shared template for the six division sites.
    Per-division values live in :root (tint, art bg) and in the two image
    files (scene.jpg = 2:1 scene, shelf.webp = repeating border strip).
  */
  :root{
    --tint:#7A2010;
    --artbg:#1E0805;
    --ink:#FFF6E8;
    --ink-dim:rgba(255,246,232,0.78);
    --ink-faint:rgba(255,246,232,0.52);
    --rule:rgba(255,246,232,0.18);
    --rule-strong:rgba(255,246,232,0.45);
    --brass:#D9A441;
    --display:Eczar,Georgia,serif;
    --body:Karla,system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --scene-h:42.4vw;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--artbg); color:var(--ink); }
  body{ font-family:var(--body); line-height:1.6; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }

  /* Page art: 2:1 scene pinned at the top, fading into the bookshelf border,
     which repeats down the left side however long the page grows. */
  .page{ position:relative; isolation:isolate; min-height:100vh; overflow:hidden;
    background:
      linear-gradient(rgba(0,0,0,0.22),rgba(0,0,0,0.22)),
      linear-gradient(to bottom, var(--artbg) calc(var(--scene-h) - 1vw), transparent calc(var(--scene-h) + 1px)),
      url('../shelf.webp') left 35.2vw / 30% auto repeat-y,
      var(--artbg); }
  .page::before{ content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:url('../scene.jpg') left top / 100% auto no-repeat;
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(var(--scene-h)*0.72),transparent var(--scene-h));
            mask-image:linear-gradient(to bottom,#000 calc(var(--scene-h)*0.72),transparent var(--scene-h)); }
  .page::after{ content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:
      linear-gradient(to left, rgba(18,10,8,0.9) 0%, rgba(18,10,8,0.72) 42%, rgba(18,10,8,0.12) 72%, transparent 100%),
      linear-gradient(color-mix(in srgb, var(--tint) 18%, transparent), color-mix(in srgb, var(--tint) 18%, transparent)); }

  .wrap{ position:relative; max-width:600px; margin-left:auto; margin-right:clamp(20px,6vw,96px); padding:clamp(48px,7vw,96px) 0 80px; }

  .eyebrow{ font-family:var(--body); font-weight:500; font-size:13px; letter-spacing:0.34em; text-transform:uppercase; color:var(--ink-dim); }
  h1{ font-family:var(--display); font-weight:700; font-size:clamp(44px,6vw,76px); line-height:0.95; margin:14px 0 22px; }
  .quote{ margin:0 0 30px; max-width:36ch; }
  .quote blockquote{ margin:0; }
  .quote p{ font-family:var(--display); font-weight:500; font-style:italic; font-size:18px; line-height:1.5; color:#E9977F; margin:0; }
  .quote figcaption{ margin-top:8px; font-family:var(--mono); font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:color-mix(in srgb, #E9977F 55%, var(--ink-faint)); }
  .lede{ font-size:17px; color:var(--ink-dim); max-width:46ch; margin:0 0 56px; }

  .label{ display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 18px; }
  .label::after{ content:''; flex:1; height:1px; background:var(--rule); }
  .label.brass{ color:var(--brass); }
  section{ margin:0 0 56px; }

  .entry{ padding:20px 0; border-bottom:1px solid var(--rule); }
  .entry:first-of-type{ padding-top:4px; }
  .entry h3{ font-family:var(--display); font-weight:500; font-size:22px; margin:0 0 4px; }
  .entry h3 a{ text-decoration:none; border-bottom:1px solid var(--rule-strong); }
  .entry h3 a:hover{ border-bottom-color:var(--ink); }
  .byline{ font-size:13px; color:var(--ink-faint); margin:0 0 8px; }
  .desc{ font-size:15.5px; color:var(--ink-dim); margin:0; }
  .credit{ font-family:var(--mono); font-size:11.5px; letter-spacing:0.04em; color:var(--ink-faint); margin:10px 0 0; }
  .credit a{ color:var(--ink-dim); text-decoration:none; border-bottom:1px solid var(--rule-strong); }

  /* Contributors: profile cards. Photo optional; initials stand in. */
  .people{ display:grid; gap:16px; }
  .person{ display:flex; gap:18px; align-items:flex-start; padding:18px; border:1px solid var(--rule); border-radius:4px; background:rgba(20,10,8,0.45); }
  .avatar{ flex:0 0 72px; width:72px; height:72px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--tint) 70%, #000); border:1px solid var(--rule-strong); font-family:var(--display); font-size:24px; color:var(--ink); }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .person h4{ font-family:var(--display); font-weight:500; font-size:19px; margin:0; }
  .person .handle{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
  .person .bio{ font-size:14.5px; color:var(--ink-dim); margin:6px 0 8px; }
  .person .links{ font-family:var(--mono); font-size:11.5px; letter-spacing:0.04em; }
  .person .links a{ text-decoration:none; border-bottom:1px solid var(--rule-strong); color:var(--ink-dim); }
  .person.open{ border-style:dashed; background:transparent; }
  .person.open .avatar{ background:transparent; border-style:dashed; color:var(--ink-faint); font-size:28px; }
  .person.open .avatar img{ object-fit:contain; padding:6px; }
  .person.open h4{ color:var(--ink-dim); }

  .slot{ padding:16px 18px; border:1px dashed var(--rule-strong); border-radius:4px; color:var(--ink-faint); font-style:italic; font-size:14.5px; margin:0 0 10px; }

  .help p{ font-size:15.5px; color:var(--ink-dim); margin:0 0 14px; max-width:46ch; }
  .pill{ display:inline-flex; align-items:center; padding:12px 20px; border:1.5px solid rgba(255,246,232,0.5); border-radius:999px; font-size:15px; letter-spacing:0.02em; text-decoration:none; transition:border-color 150ms, background 150ms; }
  .pill:hover{ border-color:var(--ink); background:rgba(255,246,232,0.1); }

  .fine{ font-size:12.5px; color:var(--ink-faint); max-width:52ch; border-top:1px solid var(--rule); padding-top:20px; margin:0; }
  .home{ display:inline-block; margin-top:22px; font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); text-decoration:none; }
  .home:hover{ color:var(--ink); }

  .parent{ display:block; margin-top:10px; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); text-decoration:none; }
  .parent:hover{ color:var(--ink); }
  /* Phones: scene becomes a band across the top, text runs below it. */
  @media (max-width:819px){
    .page{ background:var(--artbg); }
    .page::before{ bottom:auto; height:50vw; background-size:cover; background-position:left center; -webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent); mask-image:linear-gradient(to bottom,#000 70%,transparent); }
    .page::after{ display:none; }
    .wrap{ margin:0; max-width:none; padding:calc(50vw + 12px) 20px 64px; }
  }

  .qlist .quote{ max-width:44ch; margin:0 0 30px; padding-left:16px; border-left:2px solid color-mix(in srgb, #E9977F 45%, transparent); }
  .quote p.tr{ font-family:var(--body); font-style:normal; font-weight:400; font-size:14px; color:var(--ink-dim); margin-top:6px; }
</style>
</head>
<body>
<main class="page">
  <div class="wrap">
    <div class="eyebrow">Frosted Pane Press</div>
    <h1>Quotes</h1>
    <p class="lede">Our resources page shows one of these at a time. Here they all are, for anyone who kept refreshing.</p>
    <div class="label">12 quotes</div>
    <div class="qlist">
      <figure class="quote">
        <blockquote><p>Something there is that doesn’t love a wall.</p></blockquote>
        <figcaption>Robert Frost</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>Write while the heat is in you.</p></blockquote>
        <figcaption>Henry David Thoreau</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>I declare after all there is no enjoyment like reading!</p></blockquote>
        <figcaption>Jane Austen</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>Gehen Sie in sich.</p></blockquote>
        <p class="tr">[roughly translated]: Go into yourself.</p>
        <figcaption>Rainer Maria Rilke</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>The difference between the almost right word and the right word is really a large matter—it’s the difference between the lightning-bug and the lightning.</p></blockquote>
        <figcaption>Mark Twain</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>A good book is the precious life-blood of a master spirit.</p></blockquote>
        <figcaption>John Milton</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>Books are the quietest and most constant of friends.</p></blockquote>
        <figcaption>Charles W. Eliot</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>Words are, of course, the most powerful drug used by mankind.</p></blockquote>
        <figcaption>Rudyard Kipling</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>Le style est l’homme même.</p></blockquote>
        <p class="tr">[roughly translated]: Style is the man himself.</p>
        <figcaption>Buffon</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>There is no such thing as a moral or an immoral book. Books are well written, or badly written. That is all.</p></blockquote>
        <figcaption>Oscar Wilde</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>“Classic.” A book which people praise and don’t read.</p></blockquote>
        <figcaption>Mark Twain</figcaption>
      </figure>
      <figure class="quote">
        <blockquote><p>Books are the treasured wealth of the world and the fit inheritance of generations and nations.</p></blockquote>
        <figcaption>Henry David Thoreau</figcaption>
      </figure>
    </div>
    <p class="fine">Every quote here is in the public domain. Translations are our own and only approximate.</p>
    <a class="home" href="/resources/">← Resources</a>
    <a class="parent" href="https://mummyundertheumbrella.com/">A Mummy Under the Umbrella company</a>
  </div>
</main>
</body>
</html>
