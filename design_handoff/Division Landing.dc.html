<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;700&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #14100c; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: #ffffff; }
</style>
</helmet>
<div style="position: relative; min-height: 100vh; width: 100%; overflow: hidden; background: {{ tint }}; display: flex; align-items: center; justify-content: center; padding: clamp(28px, 6vw, 96px); box-sizing: border-box; font-family: Karla, system-ui, sans-serif;">
  <div style="position: absolute; inset: 0; background-image: url('assets/background.png'); background-size: cover; background-position: center; mix-blend-mode: multiply; pointer-events: none;"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(120% 90% at 30% 50%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.45) 100%); pointer-events: none;"></div>

  <div style="position: relative; width: 100%; max-width: 1180px; display: flex; flex-wrap: wrap; align-items: center; gap: clamp(28px, 5vw, 80px);">
    <div style="flex: 1 1 260px; min-width: 0; display: flex; justify-content: center;">
      <img src="{{ logo }}" alt="" style="width: 100%; max-width: 420px; height: auto; display: block; filter: drop-shadow(0 18px 40px rgba(0,0,0,0.45));">
    </div>

    <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: clamp(18px, 2.4vw, 30px);">
      <div style="font-size: clamp(11px, 1.1vw, 14px); letter-spacing: 0.34em; text-transform: uppercase; color: rgba(255,248,236,0.78); font-weight: 500;">{{ division }}</div>

      <h1 style="margin: 0; font-family: Eczar, Georgia, serif; font-weight: 700; font-size: clamp(44px, 8.2vw, 108px); line-height: 0.94; color: #FFF6E8; letter-spacing: -0.01em; text-wrap: balance;">Unwrapping<br>2027</h1>

      <div style="width: clamp(64px, 12vw, 140px); height: 2px; background: rgba(255,246,232,0.45);"></div>

      <p style="margin: 0; max-width: 34ch; font-size: clamp(15px, 1.5vw, 19px); line-height: 1.55; color: rgba(255,246,232,0.86); text-wrap: pretty;">Still under wraps. See you next year.</p>

      <a href="{{ mailto }}" style="display: inline-flex; align-items: center; gap: 10px; margin-top: 4px; padding: 14px 22px; border: 1.5px solid rgba(255,246,232,0.5); border-radius: 999px; font-size: clamp(14px, 1.3vw, 16px); letter-spacing: 0.02em; color: #FFF6E8;" style-hover="border-color: #FFF6E8; background: rgba(255,246,232,0.1);">{{ email }}</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tint&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7A2010&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#7A2010&quot;,&quot;#7A5015&quot;,&quot;#2E4A10&quot;,&quot;#1A4848&quot;,&quot;#2A2868&quot;,&quot;#701A62&quot;]},&quot;logo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/frosted-pane-press.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;division&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Frosted Pane Press&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;contact@frostedpane.com&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const email = p.email ?? "contact@frostedpane.com";
    return {
      tint: p.tint ?? "#7A2010",
      logo: p.logo ?? "assets/frosted-pane-press.png",
      division: p.division ?? "Frosted Pane Press",
      email,
      mailto: "mailto:" + email
    };
  }
}
</script>
</body>
</html>
